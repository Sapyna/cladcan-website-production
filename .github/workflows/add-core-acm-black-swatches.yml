name: Add core ACM black swatches

on:
  push:
    branches:
      - design-system-v1-acm
    paths:
      - .github/workflows/add-core-acm-black-swatches.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design-system-v1-acm
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pillow

      - name: Download current ALUCOIL colour chart
        run: |
          curl -fL --retry 4 "https://alucoil.com/wp-content/uploads/2024/04/CARTA_COLOR_ALUCOIL.pdf" -o /tmp/alucoil.pdf
          mkdir -p /tmp/alucoil
          pdftoppm -f 4 -l 4 -png -r 144 /tmp/alucoil.pdf /tmp/alucoil/page

      - name: Crop core dark colours
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          src=Image.open("/tmp/alucoil/page-4.png").convert("RGB")
          out=Path("public/images/exterior-systems/acm-acp/finishes/market")
          out.mkdir(parents=True,exist_ok=True)
          w,h=src.size

          crops={
            "alucoil-grey-black-7021.webp":(0.512,0.137,0.702,0.238),
            "alucoil-jet-black-9005.webp":(0.083,0.278,0.273,0.379),
            "alucoil-charcoal.webp":(0.512,0.621,0.702,0.722),
          }

          for name,(x1,y1,x2,y2) in crops.items():
              crop=src.crop((round(x1*w),round(y1*h),round(x2*w),round(y2*h)))
              crop=ImageOps.fit(crop,(512,512),method=Image.Resampling.LANCZOS)
              crop.save(out/name,"WEBP",quality=95,method=6)
          PY

      - name: Commit swatches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/exterior-systems/acm-acp/finishes/market/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add verified core black ACM swatches"
            git push origin HEAD:design-system-v1-acm
          fi
