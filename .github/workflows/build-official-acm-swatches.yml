name: Build official ACM finish swatches

on:
  push:
    branches:
      - design-system-v1-acm
    paths:
      - .github/workflows/build-official-acm-swatches.yml

permissions:
  contents: write

jobs:
  build-swatches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: design-system-v1-acm
          fetch-depth: 0

      - name: Install PDF renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pillow

      - name: Download official ALPOLIC chart
        run: |
          curl -fL --retry 4 --retry-delay 3 \
            "https://alpolic-americas.com/wp-content/uploads/2023/04/2024-Stock-Color-Chart-WebCard-Combined-compressed.pdf" \
            -o /tmp/alpolic-chart.pdf

      - name: Render official chart pages
        run: |
          mkdir -p /tmp/alpolic-pages
          pdftoppm -f 4 -l 6 -png -r 144 /tmp/alpolic-chart.pdf /tmp/alpolic-pages/page

      - name: Crop official swatches
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          out = Path("public/images/exterior-systems/acm-acp/finishes/official-alpolic")
          out.mkdir(parents=True, exist_ok=True)

          pages = {
              4: Image.open("/tmp/alpolic-pages/page-4.png").convert("RGB"),
              5: Image.open("/tmp/alpolic-pages/page-5.png").convert("RGB"),
              6: Image.open("/tmp/alpolic-pages/page-6.png").convert("RGB"),
          }

          # Coordinates are proportional crops of the official ALPOLIC 2024 stock-color chart.
          # They intentionally include only the printed finish rectangle, never the label or surrounding page.
          crops = {
              # PDF page 4 - neutrals / metallics
              "smx-metallic-silver.webp": (4, (0.064,0.069,0.256,0.137)),
              "mfs-mica-grey.webp":       (4, (0.510,0.323,0.702,0.391)),
              "rrm-river-rock-grey.webp":(4, (0.287,0.449,0.479,0.517)),
              "bsm-slate-black.webp":     (4, (0.287,0.703,0.479,0.769)),

              # PDF page 5 - light / premium + timber
              "clr-clear-anodized.webp":  (5, (0.064,0.323,0.256,0.390)),
              "bnt-bone-white.webp":      (5, (0.287,0.323,0.479,0.390)),
              "cmx-metallic-champagne.webp": (5, (0.510,0.323,0.702,0.390)),
              "mbx-metallic-bronze.webp": (5, (0.733,0.576,0.925,0.644)),
              "qjb-japanese-birch.webp":  (5, (0.064,0.703,0.256,0.769)),
              "qcp-ht-bamboo.webp":       (5, (0.287,0.703,0.479,0.769)),
              "qbb-teak.webp":            (5, (0.510,0.703,0.702,0.769)),
              "qwp-wild-plum.webp":       (5, (0.733,0.703,0.925,0.769)),
              "qbv-oriental-cane.webp":   (5, (0.064,0.828,0.256,0.895)),
              "mpl-maple.webp":           (5, (0.287,0.828,0.479,0.895)),
              "qaw-rio-aleon.webp":       (5, (0.510,0.828,0.702,0.895)),
              "qbt-zebrawood.webp":       (5, (0.733,0.828,0.925,0.895)),

              # PDF page 6 - timber/pattern continuation
              "qae-mahogany.webp":        (6, (0.733,0.064,0.925,0.130)),
              "wln-walnut.webp":          (6, (0.510,0.573,0.702,0.639)),
              "qco-rusted-steel.webp":    (6, (0.733,0.573,0.925,0.639)),
          }

          for filename, (page_num, box) in crops.items():
              im = pages[page_num]
              w,h = im.size
              x1,y1,x2,y2 = box
              crop = im.crop((round(x1*w), round(y1*h), round(x2*w), round(y2*h)))
              crop = ImageOps.fit(crop, (512,512), method=Image.Resampling.LANCZOS)
              crop.save(out/filename, "WEBP", quality=94, method=6)

          (out/"SOURCE.txt").write_text(
              "Source: ALPOLIC 2024 Stock Color Chart\n"
              "Official manufacturer PDF: https://alpolic-americas.com/wp-content/uploads/2023/04/2024-Stock-Color-Chart-WebCard-Combined-compressed.pdf\n"
              "Assets in this directory are direct crops of the printed swatch rectangles in that manufacturer chart.\n"
              "Physical samples remain the final authority for colour and texture.\n",
              encoding="utf-8"
          )
          PY

      - name: Commit official swatches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/exterior-systems/acm-acp/finishes/official-alpolic/
          if git diff --cached --quiet; then
            echo "No swatch changes to commit."
          else
            git commit -m "Add official ALPOLIC finish swatch crops"
            git push origin HEAD:design-system-v1-acm
          fi
