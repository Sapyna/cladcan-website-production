name: Fix ALFREX ACM swatch crops

on:
  push:
    branches:
      - design-system-v1-acm
    paths:
      - .github/workflows/fix-alfrex-acm-swatches.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design-system-v1-acm
          fetch-depth: 0

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pillow

      - name: Download official ALFREX finish chart
        run: |
          curl -fL --retry 4 "https://alfrexusa.com/storage/F-01-Alfrex-Standard-Product-Finishes.pdf" -o /tmp/alfrex.pdf
          mkdir -p /tmp/alfrex
          pdftoppm -f 2 -l 4 -png -r 144 /tmp/alfrex.pdf /tmp/alfrex/page

      - name: Re-crop swatches from inside the printed colour fields
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps

          out=Path("public/images/exterior-systems/acm-acp/finishes/market")
          pages={
            2:Image.open("/tmp/alfrex/page-2.png").convert("RGB"),
            3:Image.open("/tmp/alfrex/page-3.png").convert("RGB"),
            4:Image.open("/tmp/alfrex/page-4.png").convert("RGB"),
          }

          # Inner crops deliberately exclude the rounded printed corners,
          # labels and page background so the swatch itself fills the circle.
          crops={
            "alfrex-classic-white.webp":(2,(0.076,0.175,0.214,0.279)),
            "alfrex-bone-white.webp":(2,(0.262,0.175,0.400,0.279)),
            "alfrex-charcoal.webp":(2,(0.447,0.553,0.585,0.657)),
            "alfrex-anodic-clear-mica.webp":(3,(0.076,0.364,0.214,0.468)),
            "alfrex-pewter-mica.webp":(3,(0.821,0.364,0.960,0.468)),
            "alfrex-bright-silver-metallic.webp":(4,(0.076,0.104,0.214,0.207)),
            "alfrex-pex-pewter-metallic.webp":(4,(0.448,0.104,0.586,0.207)),
            "alfrex-faux-zinc.webp":(4,(0.262,0.543,0.400,0.647)),
            "alfrex-tile-corten.webp":(4,(0.633,0.543,0.771,0.647)),
            "alfrex-teak.webp":(4,(0.074,0.791,0.213,0.896)),
            "alfrex-golden-oak.webp":(4,(0.260,0.791,0.399,0.896)),
            "alfrex-dark-walnut.webp":(4,(0.446,0.791,0.585,0.896)),
          }

          for name,(page,box) in crops.items():
              im=pages[page]
              w,h=im.size
              x1,y1,x2,y2=box
              crop=im.crop((round(x1*w),round(y1*h),round(x2*w),round(y2*h)))
              crop=ImageOps.fit(crop,(512,512),method=Image.Resampling.LANCZOS)
              crop.save(out/name,"WEBP",quality=96,method=6)
          PY

      - name: Commit corrected assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/exterior-systems/acm-acp/finishes/market/alfrex-*.webp
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix ALFREX finish swatch crops"
            git push origin HEAD:design-system-v1-acm
          fi
