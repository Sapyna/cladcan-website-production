name: Barrie media import

on:
  push:
    branches:
      - design-system-v1-acm
    paths:
      - '.tmp-barrie/rear.part04'

permissions:
  contents: write

jobs:
  import-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design-system-v1-acm
      - name: Check all chunks exist
        id: check
        shell: bash
        run: |
          set -e
          required=(
            .tmp-barrie/front.part01
            .tmp-barrie/front.part02
            .tmp-barrie/front.part03
            .tmp-barrie/front.part04
            .tmp-barrie/front.part05
            .tmp-barrie/rear.part01
            .tmp-barrie/rear.part02
            .tmp-barrie/rear.part03
            .tmp-barrie/rear.part04
          )
          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Decode and commit media
        if: steps.check.outputs.ready == 'true'
        shell: bash
        run: |
          set -e
          mkdir -p public/images/projects/gray-lane-barrie
          cat .tmp-barrie/front.part* | base64 -d > public/images/projects/gray-lane-barrie/gray-lane-barrie-acm-stucco-dekko-front-installation-progress.webp
          cat .tmp-barrie/rear.part* | base64 -d > public/images/projects/gray-lane-barrie/gray-lane-barrie-acm-stucco-dekko-rear-completed-wide.webp
          rm -rf .tmp-barrie
          rm -f .github/workflows/barrie-media-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add two Gray Lane Barrie project photos"
          git push origin HEAD:design-system-v1-acm
