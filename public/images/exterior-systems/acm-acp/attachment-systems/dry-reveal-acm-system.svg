<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Dry Reveal ACM attachment system schematic</title>
  <desc id="desc">Conceptual section showing route-and-return ACM cassettes, an open reveal, concealed clips, rear rails and a ventilated drainage cavity.</desc>
  <rect width="1200" height="720" fill="#f5f6f4"/>
  <text x="72" y="92" fill="#8f5f2f" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" letter-spacing="4">DRY REVEAL</text>
  <text x="72" y="142" fill="#102633" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700">Open-joint route-and-return concept</text>
  <g transform="translate(92 212)">
    <rect x="650" y="6" width="54" height="400" rx="4" fill="#c9d0d2"/>
    <rect x="570" y="30" width="28" height="350" fill="#839099"/>
    <rect x="476" y="46" width="18" height="318" fill="#1f303a"/>
    <path d="M116 64 H430 V210 H392 V102 H116 Z" fill="#c2c8cb" stroke="#586a74" stroke-width="3"/>
    <path d="M116 250 H392 V360 H430 V508 H116 Z" fill="#b3bcc0" stroke="#586a74" stroke-width="3"/>
    <rect x="430" y="210" width="62" height="40" fill="#071a29"/>
    <path d="M392 190 h84 v24 h-52 v-10 h-32z" fill="#c79a5d"/>
    <path d="M392 246 h84 v24 h-52 v10 h-32z" fill="#c79a5d"/>
    <line x1="492" y1="120" x2="570" y2="120" stroke="#586a74" stroke-width="8"/>
    <line x1="492" y1="326" x2="570" y2="326" stroke="#586a74" stroke-width="8"/>
    <path d="M620 100 v210" stroke="#2b748b" stroke-width="5" stroke-dasharray="12 12"/>
    <path d="M620 310 l-10 -18 h20z" fill="#2b748b"/>
    <text x="10" y="235" fill="#102633" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700">ACM cassette</text>
    <line x1="144" y1="225" x2="360" y2="150" stroke="#8c989e" stroke-width="2"/>
    <text x="14" y="438" fill="#102633" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700">Open reveal</text>
    <line x1="136" y1="428" x2="452" y2="232" stroke="#8c989e" stroke-width="2"/>
    <text x="742" y="140" fill="#102633" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700">Concealed clip + rail</text>
    <line x1="728" y1="132" x2="490" y2="199" stroke="#8c989e" stroke-width="2"/>
    <text x="742" y="286" fill="#102633" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700">Ventilated cavity</text>
    <line x1="728" y1="278" x2="624" y2="246" stroke="#8c989e" stroke-width="2"/>
    <text x="742" y="386" fill="#5d707b" font-family="Arial,Helvetica,sans-serif" font-size="18">No exposed sealant at panel joints</text>
  </g>
  <text x="72" y="670" fill="#6c7c85" font-family="Arial,Helvetica,sans-serif" font-size="17">Conceptual schematic — final attachment, drainage and wall build-up are project- and manufacturer-specific.</text>
