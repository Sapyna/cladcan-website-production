<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Face-Fastened ACM attachment system schematic</title>
  <desc id="desc">Conceptual section showing flat ACM panels attached to rear rails with exposed fasteners and open joints.</desc>
  <rect width="1200" height="720" fill="#f5f6f4"/>
  <text x="72" y="92" fill="#8f5f2f" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" letter-spacing="4">FACE-FASTENED</text>
  <text x="72" y="142" fill="#102633" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700">Flat-panel system with visible fasteners</text>
  <g transform="translate(94 212)">
    <rect x="654" y="8" width="52" height="402" rx="4" fill="#c9d0d2"/>
    <rect x="560" y="34" width="32" height="348" fill="#4d5b63"/>
    <rect x="114" y="70" width="390" height="150" fill="#c3c9cc" stroke="#586a74" stroke-width="3"/>
    <rect x="114" y="260" width="390" height="150" fill="#b4bdc1" stroke="#586a74" stroke-width="3"/>
    <line x1="504" y1="145" x2="560" y2="145" stroke="#586a74" stroke-width="8"/>
    <line x1="504" y1="335" x2="560" y2="335" stroke="#586a74" stroke-width="8"/>
    <circle cx="476" cy="145" r="12" fill="#8f5f2f" stroke="#fff" stroke-width="3"/>
    <circle cx="476" cy="335" r="12" fill="#8f5f2f" stroke="#fff" stroke-width="3"/>
    <rect x="504" y="220" width="56" height="40" fill="#071a29"/>
    <text x="16" y="200" fill="#102633" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700">Flat ACM panel</text>
    <line x1="150" y1="192" x2="350" y2="150" stroke="#8c989e" stroke-width="2"/>
    <text x="732" y="140" fill="#102633" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700">Exposed fastener</text>
    <line x1="716" y1="132" x2="488" y2="145" stroke="#8c989e" stroke-width="2"/>
    <text x="732" y="246" fill="#102633" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700">Rear attachment rail</text>
    <line x1="716" y1="238" x2="576" y2="180" stroke="#8c989e" stroke-width="2"/>
    <text x="732" y="356" fill="#102633" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700">Open shadow joint</text>
    <line x1="716" y1="348" x2="530" y2="242" stroke="#8c989e" stroke-width="2"/>
    <text x="732" y="408" fill="#5d707b" font-family="Arial,Helvetica,sans-serif" font-size="18">Fastener heads may match or contrast with the panel finish</text>
  </g>
  <text x="72" y="670" fill="#6c7c85" font-family="Arial,Helvetica,sans-serif" font-size="17">Conceptual schematic — final fastener type, edge treatment and rail geometry are system-specific.</text>
</svg>